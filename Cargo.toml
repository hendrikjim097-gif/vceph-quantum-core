[package]
name = "rust_stateless"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
tokio = { version = "1", features = ["full"] }
sled = "0.34"
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.13"
pqcrypto-dilithium = "0.3"
pqcrypto-traits = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"


[[bench]]
name = "vceph_benchmarks"
harness = false

blake3 = "1.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
